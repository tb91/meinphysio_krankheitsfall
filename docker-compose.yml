services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: physio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d physio"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://physio:physio@db:5432/physio
      DATA_DIR: /app/data
      # Szenario liegt in der Vergangenheit: "jetzt" ist konfigurierbar.
      NOW: "2026-09-07T07:40:00+02:00"
      PORT: "3000"
    volumes:
      - ./data:/app/data:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
