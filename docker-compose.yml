services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: physio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d physio"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://physio:physio@db:5432/physio
      DATA_DIR: /app/data
      # Szenario liegt in der Vergangenheit: "jetzt" ist konfigurierbar.
      NOW: ${NOW:-2026-09-07T07:40:00+02:00}
      PORT: "3000"
      # debug zeigt auch Routine-Meldungen (z. B. "keine neuen Termino-Daten", jeder Request)
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Simuliert den externen Import-Job (z. B. Zapier): alle 5 Min. Szenario-Zeit
  # wird der fällige termino_export_*.json an die API übergeben.
  termino-sync:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "sync"]
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      DATA_DIR: /app/data
      # debug zeigt auch "Keine neuen Termino-Exporte"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
